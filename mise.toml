[tools]
go = "1.25"
golangci-lint = "latest"

[env]
PROJECT_NAME = "MonthlyListeners"
BROWSERLESS_TOKEN = "your-browserless-api-key"
SCRAPINGANT_TOKEN = "your-scrapingant-api-key"
SCRAPINGANT_ENDPOINT = "https://api.scrapingant.com/v2/general"

[tasks.install-tools]
run = "mise install"

[tasks.setup]
depends = ["install-tools"]
run = "go mod tidy"

[tasks.build]
depends = ["setup"]
run = "go build -tags goexperiment.jsonv2 -o $PROJECT_NAME main_improved.go"

[tasks.run]
depends = ["build"]
run = "./$PROJECT_NAME"

[tasks.dev]
depends = ["run"]
