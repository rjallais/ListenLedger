# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: assertive
  high_level_summary: true
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # Do not skip any usernames — ensures the repo owner gets reviews
    ignore_usernames: []
    ignore_title_keywords: []
    base_branches: []

  path_instructions:
    - path: "**/*.go"
      instructions: >
        Go 1.27 — encoding/json/v2 is stable (no GOEXPERIMENT or build tag needed).
        Imports must be ordered: stdlib, third-party, local (ListenLedger/...),
        separated by blank lines. Errors should be wrapped with fmt.Errorf and %w.
        Context must be the first parameter for I/O functions.
    - path: "**/*.templ"
      instructions: >
        Templ template files. Do not suggest editing the generated *_templ.go files.
    - path: "**/*_templ.go"
      instructions: >
        These files are auto-generated by templ. Do not review or suggest changes.
    - path: "static/styles.css"
      instructions: >
        This file is generated by gotailwind. Do not review or suggest changes.

  path_filters:
    - "!**/*_templ.go"
    - "!static/styles.css"
    - "!pb_data/**"

  tools:
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
